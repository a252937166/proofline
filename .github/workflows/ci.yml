name: Proofline CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm/cli#4828 can omit Rollup's Linux optional binary when the lockfile
      # was generated on macOS. Install the exact native peer already selected
      # by the lockfile before Vitest/Vite starts.
      - name: Restore Rollup native binary
        shell: bash
        run: |
          ROLLUP_VERSION="$(node -p "require('./node_modules/rollup/package.json').version")"
          npm install --no-save --package-lock=false "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"
      - run: npm run check
      - run: npm audit --audit-level=high
