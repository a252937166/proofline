server {
    listen 80;
    listen [::]:80;
    server_name proofline.axiqo.xyz;
    server_tokens off;

    root /var/www/proofline/current;
    index index.html;
    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # The inline x402 facilitator reaches this loopback-only route directly.
    # Never expose its token-bearing RPC bridge through the public edge.
    location ^~ /api/internal/evm-rpc/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4035;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # x402 v2 carries a signed payment offer in response headers. Keep the
        # first upstream header buffer large enough for the frozen packet hash
        # and ProofPurchase EIP-712 schema without returning edge-level 502.
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        expires 1h;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
