server {
    listen 80;
    listen [::]:80;
    server_name proofline.axiqo.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name proofline.axiqo.xyz;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/proofline.axiqo.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proofline.axiqo.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:proofline_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/proofline/current;
    index index.html;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    # The inline x402 facilitator reaches this loopback-only route directly.
    # Never expose its token-bearing RPC bridge through the public edge.
    location ^~ /api/internal/evm-rpc/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4035;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # x402 v2 carries a signed payment offer in response headers. Keep the
        # first upstream header buffer large enough for the frozen packet hash
        # and ProofPurchase EIP-712 schema without returning edge-level 502.
        proxy_buffer_size 16k;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
